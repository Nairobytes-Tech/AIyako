services:
  searxng:
    image: searxng/searxng:latest
    container_name: kioo-searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

  deep-agents:
    build: ./services/deep-agents
    container_name: kioo-deep-agents
    ports:
      - "8001:8001"
    environment:
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://host.docker.internal:8000/v1}
      - MODEL_NAME=${MODEL_NAME:-Qwen3.5-9B}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-Qwen3.5-4B}
    restart: unless-stopped

  kioo:
    build: .
    container_name: kioo-app
    ports:
      - "3000:3000"
    environment:
      - QVAC_CONFIG_PATH=/app/qvac.config.json
      - PORT=3000
      - HOST=0.0.0.0
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - searxng
      - deep-agents
    restart: unless-stopped
