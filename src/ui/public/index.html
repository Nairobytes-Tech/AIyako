<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kioo AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <span class="logo-text">Kioo</span>
            </div>
            <div class="status-line">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">Idle</span>
            </div>
        </header>

        <main class="main">
            <section class="chat-view active" id="chatView">
                <div class="messages" id="messages"></div>
                <form class="composer" id="chatForm">
                    <div class="input-wrapper">
                        <textarea id="input" placeholder="Message Kioo..." rows="1"></textarea>
                        <button id="micBtn" class="icon-btn" type="button">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 1 3 3v8a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"></path><path d="M8 11a4 4 0 1 1 8 0"></path><path d="M12 19v4"></path></svg>
                        </button>
                    </div>
                    <button id="sendBtn" class="send-btn" type="submit">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><path d="M22 2L11 13v-3C9 8 5 7 5 12c0 3 4 4 4 4v3l-9 5v-9l14-16z" fill="currentColor"></path></svg>
                    </button>
                </form>
            </section>

            <section class="goals-view" id="goalsView">
                <div class="section-header">
                    <h2>Goals</h2>
                </div>
                <div class="items-container" id="tasksContainer"></div>
            </section>

            <section class="library-view" id="libraryView">
                <div class="section-header">
                    <h2>Library</h2>
                    <div class="tab-switcher">
                        <button class="tab-subitem active" data-subtab="notes">Notes</button>
                        <button class="tab-subitem" data-subtab="artifacts">Artifacts</button>
                    </div>
                </div>
                <div class="items-container" id="notesContainer"></div>
            </section>

            <section class="more-view" id="moreView">
                <div class="section-header">
                    <h2>Settings</h2>
                </div>
                <div class="items-container">
                    <div class="setting-group">
                        <div class="setting-item">
                            <span class="setting-label">Offline Mode</span>
                            <span class="setting-value">Enabled</span>
                        </div>
                        <div class="setting-item">
                            <span class="setting-label">Model</span>
                            <span class="setting-value">Qwen3-600M</span>
                        </div>
                        <div class="setting-item">
                            <span class="setting-label">Network</span>
                            <span class="setting-value">Disconnected</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="chat">
                <span class="nav-icon">💬</span>
                <span class="nav-label">Chat</span>
            </button>
            <button class="nav-item" data-tab="goals">
                <span class="nav-icon">🎯</span>
                <span class="nav-label">Goals</span>
            </button>
            <button class="nav-item" data-tab="library">
                <span class="nav-icon">📚</span>
                <span class="nav-label">Library</span>
            </button>
            <button class="nav-item" data-tab="more">
                <span class="nav-icon">⋯</span>
                <span class="nav-label">More</span>
            </button>
        </nav>
    </div>
    <script src="app.js" type="module"></script>
</body>
</html>
